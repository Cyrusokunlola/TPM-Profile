<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Personal Profile</title>
    </head>

    <body>  
        <header>
            <h1>James' Profile</h1>
        </header>
        
        <main>
            <h2>Profile Picture</h2>
            <img src="images/profile-picture.jpg" alt="James' wearing a blue shirt"  width="400" height="341">

        <h2>Descripive Image</h2>
            <img src="images/stockphoto.jpg" alt=""   width="250" height="150">

            <h2>Figure Image</h2>
            <figure>
                <img src="images/monk.jpg" alt="Monk walking down a road in a monk robe"  width="400" height="341">
                <figcaption>A monk walking down a road</figcaption>
            </figure>

            <h2>Audio embed</h2>
            <audio controls src="audio/bombinsound.mp3"></audio>

            <h2>Video embed</h2>
            <video controls width="400" height="400" muted>
                <source src="video/volcano-video.mp4" type="video/mp4">
                <p> Your browser doesn't support HTML video. Here is a <a href="video/volcano-video.mp4">link to the video</a> instead.</p>
            </video>
        </main>
    </body>
</html>
